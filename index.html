<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>A Tiny Secret Awaits 💛</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="bg"></div>

<div class="particles">

<span>✨</span>

<span>💛</span>

<span>🤍</span>

<span>✨</span>

</div>

<div class="container">

<div class="hero">

<div class="hero-icon">✨</div>

<h1>A Tiny Secret Awaits 💛</h1>

<p>

Join us in celebrating this beautiful journey and cast your prediction.

</p>

</div>

<div class="card">

<div class="vote-container">

<div class="vote-card" data-vote="Boy">

💙

<span>Boy</span>

</div>

<div class="vote-card" data-vote="Girl">

🩷

<span>Girl</span>

</div>

<div class="vote-card" data-vote="Team Surprise">

💛

<span>Surprise</span>

</div>

</div>

<form id="predictionForm">

<input id="name"

type="text"

placeholder="Your name"

required>

<textarea

id="message"

placeholder="Share a blessing, wish, or a sweet thought 💌"

rows="4"></textarea>

<button>

Submit Prediction

</button>

</form>

<div id="successBox"></div>

</div>

</div>

<script type="module" src="script.js"></script>

</body>

</html>
