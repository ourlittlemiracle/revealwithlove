<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anish & Abiniya Baby Prediction</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #fff8e7, #f8b500);
      color: #333;
      text-align: center;
      overflow-x: hidden;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2em;
      margin: 20px;
      color: #4a2c2a;
    }
    .card {
      background: white;
      margin: 20px;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    input, textarea, button {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1em;
    }
    button {
      background: linear-gradient(45deg, #f8b500, #fceabb);
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.05);
    }
    .bar-container {
      width: 90%;
      margin: 20px auto;
      background: #eee;
      border-radius: 25px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .bar {
      height: 40px;
      line-height: 40px;
      color: white;
      font-weight: bold;
      text-align: center;
      transition: width 1s ease;
    }
    .boy { background: linear-gradient(45deg, #4facfe, #00f2fe); }
    .girl { background: linear-gradient(45deg, #ff9a9e, #fecfef); }

    /* Curtain Reveal */
    .curtain {
      position: fixed;
      top: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(135deg, #f8b500, #fff8e7);
      z-index: 999;
      transition: transform 2s ease;
    }
    .curtain.left { left: 0; }
    .curtain.right { right: 0; }
    .curtain.open.left { transform: translateX(-100%); }
    .curtain.open.right { transform: translateX(100%); }

    .reveal-text {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Playfair Display', serif;
      font-size: 2.5em;
      color: gold;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
      opacity: 0;
      transition: opacity 2s ease;
      z-index: 1000;
    }
    .reveal-text.show { opacity: 1; }
  </style>
</head>
<body>
  <h1>💎 Anish & Abiniya’s Baby Prediction 💎</h1>

  <!-- Voting Form -->
  <div class="card">
    <form id="voteForm">
      <input type="text" id="name" placeholder="Your Name (required)" required>
      <textarea id="message" placeholder="Your Message (optional)"></textarea>
      <button type="button" onclick="submitVote('Boy')">Vote Boy 👦</button>
      <button type="button" onclick="submitVote('Girl')">Vote Girl 👧</button>
    </form>
  </div>

  <!-- Results Bars -->
  <div class="bar-container">
    <div id="boyBar" class="bar boy">Boy: 0%</div>
  </div>
  <div class="bar-container">
    <div id="girlBar" class="bar girl">Girl: 0%</div>
  </div>

  <!-- Curtain Reveal -->
  <div class="curtain left"></div>
  <div class="curtain right"></div>
  <div id="revealText" class="reveal-text"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyD6Z8Z7-J93wU3nh5703Mpinx3BkBG-SjM",
      authDomain: "miracle-e40b7.firebaseapp.com",
      databaseURL: "https://miracle-e40b7-default-rtdb.firebaseio.com",
      projectId: "miracle-e40b7",
      storageBucket: "miracle-e40b7.firebasestorage.app",
      messagingSenderId: "689959535318",
      appId: "1:689959535318:web:697431e937ceeac64e3f77"
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Submit Vote
    function submitVote(prediction) {
      const name = document.getElementById('name').value.trim();
      const message = document.getElementById('message').value.trim();

      if (!name) {
        alert("Name is required!");
        return;
      }

      db.collection("votes").add({
        name: name,
        message: message,
        prediction: prediction,
        timestamp: new Date()
      }).then(() => {
        alert("Thank you for your vote!");
        document.getElementById('voteForm').reset();
      }).catch((error) => {
        console.error("Error adding vote: ", error);
      });
    }

    // Update Results Bars
    function updateBars(boyCount, girlCount) {
      const total = boyCount + girlCount;
      const boyPercent = total ? Math.round((boyCount / total) * 100) : 0;
      const girlPercent = total ? Math.round((girlCount / total) * 100) : 0;

      document.getElementById('boyBar').style.width = boyPercent + "%";
      document.getElementById('boyBar').textContent = "Boy: " + boyPercent + "%";

      document.getElementById('girlBar').style.width = girlPercent + "%";
      document.getElementById('girlBar').textContent = "Girl: " + girlPercent + "%";
    }

    // Listen for live updates
    db.collection("votes").onSnapshot((snapshot) => {
      let boyCount = 0;
      let girlCount = 0;

      snapshot.forEach(doc => {
        const data = doc.data();
        if (data.prediction === "Boy") boyCount++;
        if (data.prediction === "Girl") girlCount++;
      });

      updateBars(boyCount, girlCount);

      // Confetti burst on update
      confetti({
        particleCount: 80,
        spread: 70,
        origin: { y: 0.6 }
      });
    });

    // Reveal Curtain
    db.collection("settings").doc("reveal").onSnapshot((doc) => {
      const data = doc.data();
      if (data && data.revealGender) {
        triggerReveal(data.revealGender);
      }
    });

    function triggerReveal(gender) {
      document.querySelector('.curtain.left').classList.add('open');
      document.querySelector('.curtain.right').classList.add('open');

      const text = document.getElementById('revealText');
      text.textContent = "✨ It's a " + gender + "! ✨";
      text.classList.add('show');

      // Confetti blast
      confetti({
        particleCount: 200,
        spread: 120,
        origin: { y: 0.6 }
      });
    }
  </script>
</body>
</html>
